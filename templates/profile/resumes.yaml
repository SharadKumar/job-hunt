# state/profile/resumes.yaml
#
# The resume positionings this profile applies with. Each entry is one
# "resume type": a market-facing framing of the same career (for example
# "Solution Architect" and "Delivery Manager" from one CV corpus).
#
# Two modes:
#   - Individual mode (default after a fresh clone): this file holds complete
#     standalone entries. Every field marked (required) below must be present or
#     tools/resumes.ts drops the entry as incomplete.
#   - Team/org mode: the shared definitions live in state/org/resume-types.yaml
#     and this file activates a subset by id, overriding only person-specific
#     positioning, evidence strategy, rate bands and notes.
#
# `/onboarding` proposes and writes the first entries; `/resume-strategy`
# revises them. Hand-editing is fine as long as the YAML stays valid.

# Time and iteration budget the resume-writer subagent works to when rendering
# a baseline. Raise hard_stop_minutes on a slow machine; lower the iteration
# caps if the writer keeps looping on the same audit finding.
render_efficiency:
  target_minutes_per_baseline: 4
  hard_stop_minutes: 7
  max_full_render_iterations: 3
  max_reaudit_only_iterations: 1

resumes: []

