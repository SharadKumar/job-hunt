<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Harness</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!--
      Local harness UI. No build step, no framework, no CDN, no web font: every
      asset here is served from the same local origin as the API, so the page
      works offline and nothing about the person's pipeline leaves the machine.
    -->
    <header class="masthead">
      <div class="headline">
        <a class="brand" href="#/queue">Harness</a>
        <p class="standing" id="standing" aria-live="polite"></p>
        <details class="token" id="token-box">
          <summary>API token</summary>
          <div class="token-row">
            <label for="token-input">Stored in this browser only.</label>
            <input
              type="password"
              id="token-input"
              autocomplete="off"
              spellcheck="false"
              placeholder="Paste once"
            />
            <button type="button" id="token-save">Save</button>
            <button type="button" class="quiet" id="token-clear">Clear</button>
            <span class="state" id="token-state"></span>
          </div>
        </details>
      </div>

      <nav class="nav" aria-label="Views">
        <a href="#/queue" data-nav="queue">Queue</a>
        <a href="#/keywords" data-nav="keywords">Keywords</a>
        <a href="#/today" data-nav="today">Today</a>
        <a href="#/digest" data-nav="digest">Digest</a>
      </nav>
    </header>

    <main id="view" class="view" tabindex="-1">
      <p class="empty">Loading.</p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
