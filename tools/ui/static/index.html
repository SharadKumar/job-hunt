<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Job Hunt</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!--
      Local Job Hunt UI. No build step, no framework, no CDN, no web font: every
      asset here is served from the same local origin as the API, so the page
      works offline and nothing about the person's pipeline leaves the machine.
    -->
    <header class="top">
      <div class="wrap top-inner">
        <a class="brand" href="#/home">Job Hunt</a>
        <nav class="nav" aria-label="Views">
          <a href="#/home" data-nav="home">Home</a>
          <a href="#/applications" data-nav="applications">Applications</a>
          <a href="#/resumes" data-nav="resumes">Resumes</a>
          <a href="#/keywords" data-nav="keywords">Keywords</a>
          <a href="#/today" data-nav="today">Today</a>
          <a href="#/digest" data-nav="digest">Digest</a>
          <!-- The autopilot switch is drawn by app.js once GET /api/policy has
               answered, so the header never claims a lane it has not read. -->
          <span class="switch-slot" id="autopilot-slot"></span>
          <a class="cog" href="#/settings" data-nav="settings" aria-label="Settings" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </a>
        </nav>
      </div>
    </header>

    <main id="view" class="wrap view" tabindex="-1">
      <p class="empty">Loading.</p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
