# Test fixture: the shape of state/profile/screening-answers.yaml with every
# personal value replaced by an invented one. It carries the template's
# patterns (including the right_to_work_au "legally authorised" pattern and its
# select list), a skills_years map, and the thirteen unanswered questions the
# live file had parked on 2026-09-17, anonymised.
#
# Nothing here describes a real person, company or rate.

answers:
  - id: right_to_work_au
    patterns:
      - "right to work in australia"
      - "australian citizen|permanent resident"
      - "work in australia without (visa|sponsorship)"
      - "legally authori[sz]ed to work in australia"
    answer: "Yes, Australian Citizen with full unrestricted right to work."
    select:
      - "australian citizen|permanent resident|unrestricted"
      - "^yes"

  - id: visa_sponsorship_needed
    patterns:
      - "require (visa )?sponsorship"
      - "need sponsorship"
    answer: "No."

  - id: active_security_clearance
    patterns:
      - "(currently |already )?(hold|have|possess).*(active )?(baseline|nv1|nv2|pv|security clearance)"
      - "(active|current).*(baseline|nv1|nv2|pv|security clearance)"
      - "security clearance status"
    answer: "No current clearance. Australian citizen, eligible for Baseline and ready to apply on engagement."

  - id: notice_period
    patterns:
      - "notice period"
      - "when can you start"
      - "availability"
    answer: "One week."
    select:
      - "1 week"
      - "none, i'm ready|ready to go now"

  - id: day_rate_expectation
    patterns:
      - "day rate"
      - "daily rate"
      - "contract rate expectation"
      - "rate per day"
    answer: "$1,400 per day plus GST through Example Delivery Pty Ltd (ABN 00 000 000 000)."
    select:
      - "1,?[4-5]\\d\\d|1,?500|1500"
      - "1,?[2-3]\\d\\d|1,?300|1300|1,?200|1200"
      - "1,?[0-1]\\d\\d|1,?000|1000"

  - id: salary_expectation
    patterns:
      - "salary expectation"
      - "expected salary"
      - "expected annual"
      - "base salary"
      - "annual package"
      - "remuneration expectation"
    answer: "Contract only; day rate $1,400 plus GST. Not seeking a salaried package."
    select:
      - "\\$3[0-5]\\d\\s*k|\\$3[0-5]\\d,000"
      - "\\$300k|\\$300,000"
      - "\\$2[5-9]\\d\\s*k|\\$2[5-9]\\d,000"

  - id: years_experience_generic
    patterns:
      - "how many years'? experience do you have as"
      - "years of experience (do you have )?(as|in|with)"
    answer: "More than 5 years."
    select:
      - "more than 5 years|more than 10 years|10\\+ years"
      - "5 years"

  - id: years_with_salesforce
    patterns:
      - "years.*salesforce"
      - "experience.*salesforce"
    answer: "8+ years across Sales Cloud and Service Cloud at two invented clients."

  - id: agsva_clearance_select
    patterns:
      - "agsva|do you have a (security )?clearance|security clearance"
    answer: "No current clearance; eligible for Baseline."
    select:
      - "no, ability to obtain|able to obtain|eligible|willing to obtain|no clearance"

  - id: privacy_policy_consent
    patterns:
      - "agree to (the|our) privacy policy|privacy (policy|statement|collection)"
    answer: "Yes"
    select:
      - "^yes$|agree|accept"

  - id: remote_or_hybrid
    patterns:
      - "remote.*hybrid"
      - "work arrangement"
      - "office attendance"
    answer: "Remote preferred; open to hybrid up to two days a week."

